# Nixpacks configuration for flashservices78.fr
# Override install to allow lockfile regeneration when deps change
# Next.js 16 requires Node.js >= 20.9.0
[phases.setup]
nixPkgs = ["nodejs_20", "pnpm-9_x"]

[phases.install]
cmds = ["pnpm install --no-frozen-lockfile"]

[phases.build]
cmds = ["pnpm run build"]

[start]
cmd = "pnpm run start"
